version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongo
    volumes:
      - ./media:/application/media:ro

volumes:
  mongo_data:
